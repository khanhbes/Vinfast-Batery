services:
  # ── FastAPI AI Server (internal only, port 8001) ──────────────
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: vinfast_ai
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      AI_SERVER_INTERNAL_TOKEN: ${AI_SERVER_INTERNAL_TOKEN:?Set AI_SERVER_INTERNAL_TOKEN in the environment}
      AI_SERVER_MODELS_DIR: /app/models
    volumes:
      - models_data:/app/models
    networks:
      - vinfast_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Flask Unified API (internal, port 5000) ───────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: vinfast_api
    restart: unless-stopped
    depends_on:
      ai:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      AI_SERVER_URL: http://ai:8001
      AI_SERVER_INTERNAL_TOKEN: ${AI_SERVER_INTERNAL_TOKEN:?Set AI_SERVER_INTERNAL_TOKEN in the environment}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in the environment}
      DEV_ADMIN_KEY: ${DEV_ADMIN_KEY:?Set DEV_ADMIN_KEY in the environment}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:?Set FIREBASE_CREDENTIALS_JSON in the environment}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the environment}
      SHELLY_PROVIDER: ${SHELLY_PROVIDER:-integrator}
      SHELLY_LEGACY_HOST: ${SHELLY_LEGACY_HOST:-}
      SHELLY_LEGACY_AUTH_KEY: ${SHELLY_LEGACY_AUTH_KEY:-}
      SHELLY_LEGACY_DEVICE_ID: ${SHELLY_LEGACY_DEVICE_ID:-}
      SHELLY_LEGACY_DEVICE_NAME: ${SHELLY_LEGACY_DEVICE_NAME:-Shelly sạc xe}
      SHELLY_INTEGRATOR_TAG: ${SHELLY_INTEGRATOR_TAG:-}
      SHELLY_CONSENT_CALLBACK_URL: ${SHELLY_CONSENT_CALLBACK_URL:-}
      SHELLY_PROFILE_MASTER_KEY: ${SHELLY_PROFILE_MASTER_KEY:-}
      SMART_CHARGE_MAX_MINUTES: ${SMART_CHARGE_MAX_MINUTES:-600}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CATALOG_MODEL: ${GEMINI_CATALOG_MODEL:-gemini-2.5-flash}
      CATALOG_RESEARCH_DAILY_LIMIT: ${CATALOG_RESEARCH_DAILY_LIMIT:-50}
    volumes:
      - models_data:/app/models
      - apk_data:/app/apk
      # Consumption model is stored at repository root and mounted read-only
      # so the API can load it at /app/ev_soc_pipeline.pkl.
      - ../ev_soc_pipeline.pkl:/app/ev_soc_pipeline.pkl:ro
    networks:
      - vinfast_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "catalog_research_worker.py"]
    container_name: vinfast_catalog_worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:?Set FIREBASE_CREDENTIALS_JSON in the environment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CATALOG_MODEL: ${GEMINI_CATALOG_MODEL:-gemini-2.5-flash}
      CATALOG_RESEARCH_POLL_SECONDS: ${CATALOG_RESEARCH_POLL_SECONDS:-3}
    networks:
      - vinfast_net

  # ── React Dashboard → Nginx (internal; Caddy terminates TLS) ──
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: /api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY in the environment}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN in the environment}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID in the environment}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Set VITE_FIREBASE_STORAGE_BUCKET in the environment}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?Set VITE_FIREBASE_MESSAGING_SENDER_ID in the environment}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID in the environment}
    container_name: vinfast_dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - vinfast_net

  # ── Public HTTPS entrypoint + automatic Let's Encrypt ─────────
  caddy:
    image: caddy:2.10-alpine
    container_name: vinfast_caddy
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      # Caddy is no longer the public ingress. Keep Compose usable when it is stopped.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vinfast_net

volumes:
  models_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./models
  apk_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./apk
  caddy_data:
  caddy_config:

networks:
  vinfast_net:
    driver: bridge
