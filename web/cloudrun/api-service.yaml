apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vinfast-battery-api
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: vinfast-api-runtime@vinfast-873db.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/vinfast-873db/vinfast-battery/api:1.1.5-rc
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: vinfast-cors-origins
                  key: latest
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: vinfast-admin-emails
                  key: latest
            - name: AI_SERVER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vinfast-ai-server-token
                  key: latest
            - name: SHELLY_PROFILE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: vinfast-shelly-profile-master-key
                  key: latest
            - name: SMART_CHARGE_MAX_MINUTES
              value: "600"
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 30
