name: Flutter platform CI

on:
  push:
    branches: [main, feature/ios-platform]
  pull_request:

jobs:
  ios-unsigned:
    name: iOS unsigned (TestFlight readiness)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - name: Ensure generated iOS Runner project exists
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --org com.khanhbes --project-name vinfast_battery --no-pub .
          fi
          sed -i '' 's/com\.khanhbes\.vinfastBattery/com.khanhbes.vinfastbattery/g' ios/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: pod install --repo-update
        working-directory: app/ios
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Build unsigned iPhone application
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/unsigned-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

  android-regression:
    name: Android regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
