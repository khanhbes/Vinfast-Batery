name: iOS free sideload IPA

on:
  workflow_dispatch:
  push:
    branches: [feature/ios-platform]
    paths:
      - '.github/workflows/ios-free-sideload.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build IPA for Windows sideloading
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Generate the Xcode Runner project
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --org com.khanhbes --project-name vinfast_battery --no-pub .
          fi
          sed -i '' 's/com\.khanhbes\.vinfastBattery/com.khanhbes.vinfastbattery/g' ios/Runner.xcodeproj/project.pbxproj

      # A free Apple ID cannot sign the APNs entitlement. The TestFlight workflow
      # keeps the entitlement; only this disposable sideload build removes it.
      - name: Remove paid-team-only push entitlement
        run: |
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" ios/Runner/Runner.entitlements 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: app/ios

      - name: Build unsigned iPhone application
        id: ios-build
        continue-on-error: true
        run: flutter build ios --release --no-codesign

      # Flutter 3.41 can return a non-zero status after a successful Xcode build
      # when no Development Team is present. For sideloading, the executable is
      # intentionally unsigned and will be signed later on Windows.
      - name: Verify unsigned device binary
        run: |
          test -f build/ios/iphoneos/Runner.app/Runner
          file build/ios/iphoneos/Runner.app/Runner
          lipo -info build/ios/iphoneos/Runner.app/Runner

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/free-sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/free-sideload/Payload/Runner.app
          cd build/ios/free-sideload
          /usr/bin/zip -qry VinFast-Battery-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinFast-Battery-iOS-free-sideload
          path: app/build/ios/free-sideload/VinFast-Battery-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
