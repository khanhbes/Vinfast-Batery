name: iOS free sideload IPA

on:
  workflow_dispatch:
  push:
    branches: [feature/ios-platform]
    paths:
      - '.github/workflows/ios-free-sideload.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build IPA for Windows sideloading
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Generate the Xcode Runner project
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --org com.khanhbes --project-name vinfast_battery --no-pub .
          fi
          sed -i '' 's/com\.khanhbes\.vinfastBattery/com.khanhbes.vinfastbattery/g' ios/Runner.xcodeproj/project.pbxproj

      # A free Apple ID cannot sign the APNs entitlement. The TestFlight workflow
      # keeps the entitlement; only this disposable sideload build removes it.
      - name: Remove paid-team-only push entitlement
        run: |
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" ios/Runner/Runner.entitlements 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: app/ios

      - name: Build unsigned iPhone application
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/free-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify unsigned device app and frameworks
        run: |
          bash ios/scripts/verify_ios_app.sh \
            build/ios/free-derived/Build/Products/Release-iphoneos/Runner.app

      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/free-sideload
          mkdir -p build/ios/free-sideload/Payload

          # Sideloadly runs on Windows, where ZIP symlinks inside versioned
          # frameworks are not reliably materialized. Copy with -L so every
          # framework executable is a real file in the IPA.
          /bin/cp -RL \
            build/ios/free-derived/Build/Products/Release-iphoneos/Runner.app \
            build/ios/free-sideload/Payload/Runner.app
          /usr/bin/xattr -cr build/ios/free-sideload/Payload/Runner.app

          if /usr/bin/find build/ios/free-sideload/Payload -type l -print -quit | /usr/bin/grep -q .; then
            echo "The Windows sideload package still contains symbolic links." >&2
            exit 1
          fi

          bash ios/scripts/verify_ios_app.sh \
            build/ios/free-sideload/Payload/Runner.app

          cd build/ios/free-sideload
          /usr/bin/zip -qr VinFast-Battery-unsigned.ipa Payload

      - name: Verify packaged IPA round trip
        run: |
          rm -rf build/ios/free-sideload-check
          mkdir -p build/ios/free-sideload-check
          /usr/bin/unzip -q \
            build/ios/free-sideload/VinFast-Battery-unsigned.ipa \
            -d build/ios/free-sideload-check
          test -d build/ios/free-sideload-check/Payload/Runner.app
          bash ios/scripts/verify_ios_app.sh \
            build/ios/free-sideload-check/Payload/Runner.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinFast-Battery-iOS-free-sideload
          path: app/build/ios/free-sideload/VinFast-Battery-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
