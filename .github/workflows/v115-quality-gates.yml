name: VinFast Battery v1.1.5 quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze (bounded)
        run: timeout --signal=TERM 5m flutter analyze --no-pub 2>&1 | tee flutter-analyze.log
      - name: Flutter tests (bounded)
        run: timeout --signal=TERM 10m flutter test --no-pub 2>&1 | tee flutter-test.log
      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics-${{ github.sha }}
          path: app/flutter-*.log

  backend:
    name: Flask API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q

  gateway:
    name: Smart charger gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart_charger_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: smart_charger_gateway/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q

  firestore-rules:
    name: Firestore Rules emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/rules_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/rules_tests/package.json
      - run: npm install --no-audit --no-fund
      - run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project vinfast-rules-test "npm test"

  hygiene:
    name: Release configuration and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked credentials and laptop endpoints
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq 'firebase-adminsdk|service-account|serviceAccountKey|\.jks$|\.keystore$'; then
            echo 'Tracked credential/signing file detected' >&2
            exit 1
          fi
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_key"[[:space:]]*:' -- ':!*.md' ':!app/pubspec.lock' ':!app/android/app/google-services.json' ':!app/ios/Runner/GoogleService-Info.plist'; then
            echo 'Potential secret detected in tracked source' >&2
            exit 1
          fi
      - name: Verify release URL is not a Tailscale default
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude='*.md' 'tail[a-z]*\.ts\.net' app web; then
            echo 'Tailscale endpoint must not be used by release source' >&2
            exit 1
          fi
      - name: Reject new mojibake in source additions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            diff_args=("origin/${GITHUB_BASE_REF}...HEAD")
          else
            diff_args=("HEAD^" "HEAD")
          fi
          if git diff --unified=0 "${diff_args[@]}" -- app/lib web \
            | grep -E '^\+[^+].*(Ã|Â|â€¦)' ; then
            echo 'New mojibake text detected in source additions' >&2
            exit 1
          fi

  release-build:
    name: Release candidate build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [flutter, backend, gateway, firestore-rules, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Require managed HTTPS production API URL
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]
      - name: Build release APK
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: flutter build apk --release --build-number=115 --build-name=1.1.5 --dart-define=APP_API_BASE_URL="$PRODUCTION_API_BASE_URL"
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Record APK hash
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: vinfast-battery-1.1.5-release-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
